# fail2ban filter for aged — matches auth failure log lines emitted by
# bearerMiddleware.  The line format is pinned by the aged spec:
#
#   auth failure: <METHOD> <PATH> from <IP>
#
# The path segment uses .+ (not \S+) because URL paths decoded by Go's
# net/http may contain spaces (e.g. /secrets/ha%20token → /secrets/ha token).
#
# To test against a real journal entry:
#   fail2ban-regex --usedns=no \
#     "auth failure: GET /secrets/ha-token from 198.51.100.42" \
#     /etc/fail2ban/filter.d/aged-auth.conf

[Definition]
prefregex = ^%(__prefix_line)s
failregex = auth failure: \S+ .+ from <HOST>(?::\d+)?$
ignoreregex =
