# fail2ban jail for aged — blocks IPs that repeatedly fail bearer-token auth.
#
# Prerequisites:
#   1. aged runs as a systemd unit named aged.service (the default install).
#   2. Caddy sets X-Real-IP on every proxied request — see README § fail2ban
#      integration for the required Caddyfile directive.
#   3. Copy this file to /etc/fail2ban/jail.d/aged.conf, copy
#      ../filter.d/aged-auth.conf to /etc/fail2ban/filter.d/aged-auth.conf,
#      then reload: systemctl reload fail2ban
#
# Tuning:
#   maxretry  — failed attempts within findtime before ban
#   findtime  — sliding window in seconds
#   bantime   — ban duration in seconds (use -1 for permanent)

[aged]
enabled  = true
backend  = systemd
journalmatch = _SYSTEMD_UNIT=aged.service
filter   = aged-auth
maxretry = 5
findtime = 60
bantime  = 600
