name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, vet, format, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race detector)
        run: go test -race ./...

      # Deliberately does NOT pin go-version-file/go-version-input to this
      # project's own toolchain: golang.org/x/vuln's @latest release can
      # (and does) require a newer Go than this project pins, and chaining
      # a second setup-go call after the main "Set up Go" step inherits a
      # job-level GOTOOLCHAIN=local that makes the toolchain directive
      # unreliable anyway. Let the action use its own default ('stable')
      # Go toolchain to build and run govulncheck; it still scans this
      # module's own source and dependency graph regardless of which Go
      # binary is on PATH while it runs.
      - name: Vulnerability scan (govulncheck)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
